# Turn this Linux box into a router.
#
# Without this the kernel drops any packet that isn't addressed to one of its
# own interfaces, and the LAN-to-tunnel handoff silently fails.
#
# Debian 13 has no /etc/sysctl.conf - kernel parameters live in drop-ins here.
# Apply with:  sysctl --system
net.ipv4.ip_forward=1
